name: meta-commentary-gate

# Blocking conformance check for cinatra-ai/docs#114: published, user-facing
# pages must not carry meta/implementation commentary about how the docs
# themselves are produced, compiled, mirrored, or maintained ("this page is
# compiled from…", "(hub forthcoming)", editorial TODOs, and the like). See
# scripts/check-meta-commentary.mjs for the pattern list, the contributor-docs
# skip-paths, and the reviewed allowlist for verified product-content false
# positives (.github/meta-commentary-gate-allowlist.json).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  meta-commentary-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Check for meta/implementation commentary on published pages
        run: node scripts/check-meta-commentary.mjs
