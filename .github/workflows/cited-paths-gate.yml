name: cited-paths-gate

# Cheap conformance check for cinatra-ai/docs#70: extracts cited
# cinatra-ai/cinatra file/directory paths from this repo's Markdown and fails
# if any no longer exist against that repo's default branch. Nightly +
# manual only (not a required PR check) — see scripts/check-cited-paths.mjs
# for what it does and does not catch.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cited-paths-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Check cited cinatra paths
        run: node scripts/check-cited-paths.mjs
