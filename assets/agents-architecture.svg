  <text x="155" y="514" text-anchor="middle" font-family="ui-monospace,monospace"
        font-size="10" fill="#388bfd">@openai/agents · Responses API</text>
  <text x="155" y="531" text-anchor="middle" font-family="ui-monospace,monospace"
        font-size="10" fill="#8b949e">run() replaces manual loop</text>
  <text x="155" y="548" text-anchor="middle" font-family="ui-monospace,monospace"
        font-size="10" fill="#8b949e">RunHooks: HITL · budget · tracing</text>

  <!-- Anthropic -->
  <rect x="321" y="474" width="278" height="90" rx="5" fill="#180f2e" stroke="#6e40c9" stroke-width="1.2"/>
  <text x="460" y="496" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif"
        font-size="12" font-weight="700" fill="#a371f7">Anthropic</text>
  <text x="460" y="514" text-anchor="middle" font-family="ui-monospace,monospace"
        font-size="10" fill="#8957e5">@anthropic-ai/sdk · Messages API</text>
  <text x="460" y="531" text-anchor="middle" font-family="ui-monospace,monospace"
        font-size="10" fill="#8b949e">manual tool loop (unchanged)</text>
  <text x="460" y="548" text-anchor="middle" font-family="ui-monospace,monospace"
        font-size="10" fill="#8b949e">native MCP beta · function tools</text>

  <!-- Gemini -->
  <rect x="626" y="474" width="278" height="90" rx="5" fill="#091e10" stroke="#196c2e" stroke-width="1.2"/>
  <text x="765" y="496" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif"
        font-size="12" font-weight="700" fill="#3fb950">Gemini</text>
  <text x="765" y="514" text-anchor="middle" font-family="ui-monospace,monospace"
        font-size="10" fill="#2ea043">@google/genai · adapter pattern</text>
  <text x="765" y="531" text-anchor="middle" font-family="ui-monospace,monospace"
        font-size="10" fill="#8b949e">no agent SDK — manual loop</text>
  <text x="765" y="548" text-anchor="middle" font-family="ui-monospace,monospace"
        font-size="10" fill="#8b949e">media generation · function tools</text>

  <!-- Arrow → row 6 -->
  <line x1="460" y1="564" x2="460" y2="582" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── ROW 6: Cross-cutting ───────────────────────── y 585–660 -->
  <text x="16" y="582" font-family="ui-sans-serif,system-ui,sans-serif"
        font-size="9" font-weight="600" fill="#484f58" letter-spacing="1.5">CROSS-CUTTING CONCERNS</text>

  <!-- MCP Injection -->
  <rect x="16" y="588" width="278" height="70" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="155" y="610" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif"
        font-size="11" font-weight="600" fill="#e6edf3">MCP Server Tool Injection</text>
  <text x="155" y="628" text-anchor="middle" font-family="ui-monospace,monospace"
        font-size="10" fill="#8b949e">native type on every OpenAI call</text>
  <text x="155" y="645" text-anchor="middle" font-family="ui-monospace,monospace"
        font-size="10" fill="#8b949e">function fallback for Anthropic</text>

  <!-- Skills -->
  <rect x="321" y="588" width="278" height="70" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="460" y="610" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif"
        font-size="11" font-weight="600" fill="#e6edf3">Skills · SKILL.md</text>
  <text x="460" y="628" text-anchor="middle" font-family="ui-monospace,monospace"
        font-size="10" fill="#8b949e">loaded from DB via MCP</text>
  <text x="460" y="645" text-anchor="middle" font-family="ui-monospace,monospace"
        font-size="10" fill="#8b949e">delivered as read_skill function tools</text>

  <!-- OTel -->
  <rect x="626" y="588" width="278" height="70" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="765" y="610" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif"
        font-size="11" font-weight="600" fill="#e6edf3">OpenTelemetry Tracing</text>
  <text x="765" y="628" text-anchor="middle" font-family="ui-monospace,monospace"
        font-size="10" fill="#8b949e">in-process: @openai/agents built-in</text>
  <text x="765" y="645" text-anchor="middle" font-family="ui-monospace,monospace"
        font-size="10" fill="#8b949e">distributed: custom OTel spans</text>
</svg>
