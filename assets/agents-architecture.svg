  </text>

  <!-- OpenAI -->
  <rect x="16" y="474" width="278" height="90" rx="5" fill="#001f35" stroke="#1f6feb" stroke-width="1.2"/>
  <text x="155" y="496" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif"
