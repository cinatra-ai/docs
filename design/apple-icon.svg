<!--
  Cinatra Apple home-screen / install icon - design-system.html section I
  "App icon": "Mustard fedora centred on a navy rounded square. The fedora
  is sized at ~55% of the icon width with even optical breathing room top
  and bottom. Never the wordmark in an app icon."

  Navy is the ink token, mustard is the logo token (brand-mustard #c79545).

  SOURCE OF TRUTH for the fedora paths: src/lib/cinatra-brand.ts (CINATRA_LOGO).
  When updating the logo, copy the brim and crown paths from that file.

  Geometry: fedora canvas is 0 0 512 320; glyph spans x72-440 (width 368).
  scale 0.765 gives glyph width ~281.6 (55% of 512); translate(60 134) centres
  it with even side margins and top/bottom breathing room.

  Rasterized to src/app/apple-icon.png (the Next.js App Router apple-icon route).
  The favicon at src/app/icon.svg is a separate asset (white ground + line border).
-->
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Cinatra">
  <rect width="512" height="512" rx="112" fill="#15213a" />
  <g transform="translate(60 134) scale(0.765)" fill="#c79545">
    <path d="M72 214 C 72 200 96 190 130 188 C 168 186 196 200 256 210 C 316 220 358 214 400 200 C 426 192 440 196 440 208 C 440 222 420 234 388 242 C 340 254 288 256 256 256 C 202 256 132 248 100 238 C 80 232 72 224 72 214 Z" />
    <path d="M146 188 C 150 130 176 86 212 72 C 226 66 240 64 252 64 C 262 64 270 70 268 80 L 264 100 C 272 88 288 82 300 82 C 332 82 356 118 362 188 Z" />
  </g>
</svg>
